title: My Blog
description: "Notes on CS, running, and whatever else"
url: "http://localhost:4000"
baseurl: ""

markdown: kramdown
permalink: /:year/:month/:day/:title/

theme: minima

plugins:
  - jekyll-feed
  - jekyll-remote-theme

# With jekyll-remote-theme plugin enabled.
remote_theme: jekyll/minima

exclude:
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md

timezone: Asia/Ho_Chi_Minh

sass:
  quiet_deps: true
  silence_deprecations: ["import", "color-functions", "global-builtin"]
