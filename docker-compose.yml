lservices:

  # `docker compose exec jekyll` runs a command inside the already-running 
  # container for the service named `jekyll`.
  jekyll:
    build: .
    ports:
      - "4000:4000"
      - "35729:35729"  # livereload
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    
    # The command being executed inside the `jekyll` container.
    # 1/
    # `bundle exec` runs the following command using the exact gem versions 
    # locked in your Gemfile.lock, rather than whatever gem versions happen to 
    # be installed globally. This matters because you could have multiple 
    # versions of the jekyll gem installed in the container, and bundle exec 
    # makes sure it uses the one your project actually depends on.
    # 2/
    # jekyll serve --host 0.0.0.0 --livereload --drafts — the real Jekyll command: 
    # start the dev server, bind to all network interfaces 
    # (0.0.0.0, not just localhost, so it's reachable from outside the container), 
    # enable live-reload, and include draft posts.
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload --drafts

    # For production build, open another terminal window and run this, while
    # keeping the container's main process (PID 1) when you do `docker compose up`
    # running in the original terminal window.
    # See .github/workflows/deploy.yml file for an example.
    # docker compose exec jekyll bundle exec jekyll build --config _config.yml,_config_production.yml

    # Github Actions needs `x86_64-linux` platform support.
    # ```
    # Your bundle only supports platforms ["aarch64-linux-gnu"] but your local
    # platform is x86_64-linux. Add the current platform to the lockfile with
    # `bundle lock --add-platform x86_64-linux` and try again.
    # Error: The process '/opt/hostedtoolcache/Ruby/3.2.11/x64/bin/bundle' failed with exit code 16
    # ```
    # docker compose exec jekyll bundle lock --add-platform x86_64-linux

volumes:
  bundle_cache:
